services:
  app:
    build: .
    # CI/CD 部署时通过 APP_IMAGE 指定 GHCR 上的镜像,本地开发不设则用 taskboard:local
    image: ${APP_IMAGE:-taskboard:local}
    container_name: taskboard-app
    ports:
      - "8090:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/taskboard?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
      DB_USER: app
      DB_PASSWORD: app123456
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: taskboard-db
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: taskboard
      MYSQL_USER: app
      MYSQL_PASSWORD: app123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --lower_case_table_names=1
    volumes:
      - taskboard_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123456 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  cache:
    image: redis:7-alpine
    container_name: taskboard-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - taskboard_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskboard_mysql:
  taskboard_redis:
