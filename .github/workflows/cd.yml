name: cd

# 手动触发,或打 v* 标签时触发。
# 等自托管 Runner 注册好之后,可以把 push.branches 打开,实现"合到 main 就自动部署"。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        shell: pwsh
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        shell: pwsh
        run: docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy
        shell: pwsh
        env:
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: docker compose up -d --no-build

      - name: Health check
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri http://localhost:8081/actuator/health -UseBasicParsing -TimeoutSec 5
              if ($r.Content -match 'UP') {
                Write-Host "deploy healthy"
                exit 0
              }
            } catch {
              # 容器还没起来,继续等
            }
            Start-Sleep -Seconds 5
          }
          Write-Error "health check failed after 150s"
          exit 1
